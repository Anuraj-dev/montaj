# Arshiya birthday film — port of film.html 78–362 (1080x1920, 30 fps, 165 s).
video:
  size: 1080x1920
  fps: 30
  bpm: 76
  look: golden-film
  background: "#07060a"
  outro: {type: fade, dur: 1.2s}
  motion_blur: 2
assets: assets
# film.html 79–86 C
markers:
  hum: 5.2s
  v1: 12.0s
  masjid: 17.9s
  mehendi: 23.74s
  chaar: 29.88s
  pre: 34.9s
  pre2: 41.4s
  ch1: 47.96s
  ch1b: 52.82s
  ch1c: 58.8s
  ch1d: 64.58s
  ch1e: 68.1s
  ch1end: 72s
  v2: 72s
  pahad: 77.78s
  gaadi: 83.42s
  so: 88.46s
  muskaan: 94.22s
  br: 99.98s
  br2: 105.98s
  br3: 112.38s
  build: 118.4s
  ch2: 124.88s
  ch2b: 129.84s
  ch2c: 136.84s
  janam: 141.6s
  jaan: 145.96s
  arshiya: 148.04s
  hb: 151.06s
  hamesha: 154.36s
  samar: 157.3s
audio:
  track: music/song.wav
  fade_out: 3s
# film.html 372 dustK — linear P() ramps, summed (no overlap)
tracks:
  dust:
    - {t: 0s, v: .35}
    - {t: ch1-1s, v: .35}
    - {t: ch1, v: .85, ease: linear}
    - {t: ch1end, v: .85}
    - {t: ch1end+3s, v: .50, ease: linear}
    - {t: br3, v: .50}
    - {t: ch2, v: 1.20, ease: linear}
    - {t: hb, v: 1.20}
    - {t: hb+1.5s, v: .60, ease: linear}
  # film.html 404 leakK
  glow:
    - {t: 0s, v: .25}
    - {t: ch1-0.5s, v: .25}
    - {t: ch1, v: .60, ease: linear}
    - {t: v2, v: .60}
    - {t: v2+3s, v: .25, ease: linear}
    - {t: br3, v: .25}
    - {t: ch2, v: .70, ease: linear}
    - {t: hb, v: .70}
    - {t: hb+1s, v: .20, ease: linear}
  # film.html 406 barH — es = sine; product of ramps, no overlap
  bars:
    - {t: 0s, v: 150}
    - {t: ch1-0.6s, v: 150}
    - {t: ch1+0.4s, v: 0, ease: sine}
    - {t: v2, v: 0}
    - {t: v2+2s, v: 150, ease: sine}
    - {t: br-0.5s, v: 150}
    - {t: br+0.5s, v: 0, ease: sine}
# film.html 403 HITS (k .7), 368 BURSTS (n, pos)
fx:
  - {hit: 0.7, at: ch1}
  - {hit: 0.7, at: ch2}
  - {hit: 0.7, at: janam}
  - {burst: 70, at: ch1, pos: [540, 1100]}
  - {burst: 90, at: ch2, pos: [540, 1300]}
  - {burst: 140, at: janam+1s, pos: [540, 1000]}
  - {burst: 120, at: arshiya, pos: [540, 1180]}
  - {burst: 60, at: arshiya+1.4s, pos: [300, 700]}
  - {burst: 60, at: arshiya+2s, pos: [780, 760]}
