text:
  # film.html 195–199
  - from: 0s
    to: 7.2s
    fade_out: 0.9s
    lines:
      - {text: "a little film for", style: caps, y: 700, at: 1.2s, stagger: 0.12s}
      - {text: Arshiya, style: script, size: 230, y: 760, at: hum-0.3s, by: char, stagger: 0.09s, dur: 1.4s, rise: 10}
      - {text: "from Samar, with all his heart", style: serif, italic: true, size: 46, y: 1110, at: hum+1.0s}
  # film.html 203–207
  - from: 7.2s
    to: v1
    fade_out: 0.5s
    lines:
      - {text: "Some stories begin", style: serif, italic: true, y: 1330, at: 7.6s}
      - {text: "with a hand held", style: serif, italic: true, y: 1430, at: 8.8s}
      - {text: "and never let go.", style: serif, y: 1560, at: 10.0s, color: gold}
  # film.html 210
  - from: v1-0.2s
    to: v1+4.2s
    fade_out: 0.6s
    lines:
      - {text: "I  ·  the golden hours", style: caps, y: 200, at: v1+0.1s}
  # film.html 219–224
  - from: chaar
    to: pre+0.2s
    fade_out: 0.6s
    lines:
      - {text: "4", style: serif, gold: true, size: 420, y: 480, at: chaar+0.2s, dur: 1.4s, weight: 300, line_height: 1, sweep: [chaar, pre]}
      - {text: years, style: caps, size: 40, y: 940, at: chaar+0.9s}
      - {text: "and it still feels", style: serif, italic: true, y: 1150, at: chaar+2.3s}
      - {text: "like yesterday.", style: serif, italic: true, y: 1250, at: chaar+3.2s}
  # film.html 228–232
  - from: pre
    to: pre2+0.2s
    fade_out: 0.5s
    lines:
      - {text: "तेरा हाथ हाथ में हो अगर", style: deva, y: 760, at: pre+0.3s, stagger: 0.35s}
      - {text: "तो सफ़र ही असल-ए-हयात है", style: deva, y: 870, at: pre+3.0s, stagger: 0.3s, color: gold}
      - {text: "if your hand is in mine, the journey itself is life", style: serif, italic: true, size: 38, y: 1040, at: pre+4.2s, stagger: 0.06s}
  # film.html 235–238
  - from: pre2+0.4s
    to: ch1-0.1s
    fade_out: 0.4s
    lines:
      - {text: "and every day since", style: serif, italic: true, size: 64, y: 1460, at: pre2+0.8s}
      - {text: "has been about you", style: serif, italic: true, size: 64, y: 1550, at: pre2+3.4s}
  # film.html 242–245
  - from: ch1
    to: ch1b+0.2s
    fade_out: 0.5s
    lines:
      - {text: ARSHIYA, style: serif, gold: true, size: 170, y: 1240, at: ch1+0.1s, by: char, stagger: 0.08s, dur: 1.2s, weight: 600, tracking: 0.16, indent: 0.16, sweep: [ch1, ch1b]}
      - {text: "turns twenty-two", style: script, size: 110, y: 1440, at: ch1+2.4s, stagger: 0.22s}
  # film.html 249–252
  - from: ch1c
    to: ch1d
    fade_out: 0.5s
    lines:
      - {text: "baaees baras ki tu,", style: serif, italic: true, size: 70, y: 200, at: ch1c+0.1s}
      - {text: "meri saari duniya", style: script, size: 104, y: 285, at: ch1c+3.6s}
  # film.html 258
  - from: v2+0.6s
    to: v2+5.4s
    fade_out: 0.8s
    lines:
      - {text: "II  ·  the quiet moments", style: caps, y: 200, at: v2+1.0s}
  # film.html 261–267
  - from: so-0.6s
    to: muskaan+0.2s
    fade_out: 0.6s
    lines:
      - {text: "She doesn’t even realise", style: serif, italic: true, size: 60, y: 520, at: so-0.2s}
      - {text: "how peaceful the world becomes", style: serif, italic: true, size: 60, y: 600, at: so+1.2s}
      - {text: "when she sleeps in my arms.", style: serif, italic: true, size: 60, y: 680, at: so+2.6s}
      - {text: "I’ll always keep her safe,", style: serif, italic: true, size: 56, y: 860, at: so+4.0s, color: gold}
      - {text: "even in the silence of her dreams.", style: serif, italic: true, size: 56, y: 935, at: so+4.8s, color: gold}
