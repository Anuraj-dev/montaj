# A voice clip with punch captions. Needs assets/voice.mp4 and `montaj transcribe voice` first.
# No audio block: the captioned clip's own sound is linked in (as `audio: true` on its shots).
video: {size: 1080x1920, fps: 30, look: clean}
shots:
  - {clip: voice, range: [0s, 30s]}
captions: {source: voice, preset: punch}
