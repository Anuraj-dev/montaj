# Vidyut birthday montage (port of claude-test/bday-video/v2/film2.py): 28 s, 120 BPM, no text, no audio.
# Photos stay still; motion lives in the transitions and the closing drone move over a wall of prints.
video:
  size: 1080x1920
  fps: 30
  bpm: 120
  look: warm-film
  intro: {type: white-lift, dur: 30f}
  outro: {type: glow, dur: 110f}
  motion_blur: 6
assets: assets
shots:
  - {photo: "16", hold: 4b, focus: [470, 745], zoom: 1.3}
  - {photo: "32", hold: 4b, focus: [529, 740], zoom: 1.3, in: {type: swirl, dur: 22f, center: [431, 578]}}
  - {photo: "22", hold: 2b, crop: [60, 180, 865, 1330], flash: 0.3}
  - {photo: "28", hold: 1b, crop: [60, 180, 865, 1330], focus: [520, 800], flash: 0.25}
  - {photo: "20", hold: 1b, focus: [380, 760], flash: 0.15}
  - {photo: "21", hold: 1b, crop: [60, 180, 865, 1330], focus: [520, 850], flash: 0.15}
  - {photo: "12", hold: 1b, crop: [0, 0, 899, 1550], focus: [392, 610], flash: 0.15}
  - {photo: "19", hold: 1b, focus: [480, 680], flash: 0.15}
  - {photo: "09", hold: 5b, focus: [360, 640], in: {type: whip, dur: 14f, axis: x}}
  - {photo: "38", hold: 3b, focus: [360, 500], flash: 0.45}
  - {photo: "29", hold: 46f, crop: [0, 0, 899, 1080], in: {type: fade, dur: 15f}}
  - {photo: "37", hold: 59f, focus: [537, 742], zoom: 1.45, in: {type: whip, dur: 14f, axis: y}}
  - hold: 390f
    in: {type: fade, dur: 15f}
    wall:
      grid: 1500x1950
      seed: 5
      jitter: 70
      rot: 4
      print_height: 1300
      prints:
        - {photo: "34", cell: [-2, 0], straight: true}
        - {photo: "09", cell: [-1, 0]}
        - {photo: "10", cell: [0, 0], straight: true, scale: 1.0}
        - {photo: "16", cell: [1, 0]}
        - {photo: "38", cell: [-3, 0]}
        - {photo: "32", cell: [2, 0]}
        - {photo: "20", cell: [-3, -1]}
        - {photo: "22", cell: [-2, -1], crop: [60, 180, 865, 1330]}
        - {photo: "37", cell: [-1, -1]}
        - {photo: "12", cell: [0, -1], crop: [0, 0, 899, 1550]}
        - {photo: "21", cell: [1, -1], crop: [60, 180, 865, 1330]}
        - {photo: "19", cell: [-3, 1]}
        - {photo: "28", cell: [-2, 1], crop: [60, 180, 865, 1330]}
        - {photo: "33", cell: [-1, 1]}
        - {photo: "29", cell: [0, 1], crop: [0, 0, 899, 1080]}
        - {photo: "35", cell: [1, 1], crop: [0, 0, 1024, 890]}
      light: {center: [-1500, 0], radius: [4200, 3000]}
      camera:
        pos:
          - {t: 0f, print: "34", at: [420, 640]}
          - {t: 110f}
          - {t: 220f, print: "10", at: [512, 740], ease: cubic}
        zoom:
          - {t: 0f, value: 1.606, print: "34"}
          - {t: 45f}
          - {t: 110f, value: 0.42, ease: cubic}
          - {t: 220f}
          - {t: 290f, value: 1.36, print: "10", ease: cubic}
fx:
  - {leak: 0.35, at: 70f, dir: 1}
  - {leak: 0.40, at: 225f, dir: -1}
  - {leak: 0.35, at: 391f, dir: 1}
  - {leak: 0.25, at: 600f, dir: -1}
  - {leak: 0.45, at: 750f, dir: 1}
