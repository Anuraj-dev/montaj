[project]
name = "montaj"
version = "0.1.0"
description = "Agent-native video harness: YAML spec in, finished video out"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "pillow>=11",
    "pydantic>=2.9",
    "pyyaml>=6",
    "torch==2.9.1",
    "websocket-client>=1.9.2",
]

[project.scripts]
montaj = "montaj.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA (deselect with -m 'not gpu')"]
